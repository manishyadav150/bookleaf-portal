
spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookleaf_portal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

bookleaf.demo.admin-email=admin@bookleaf.local
bookleaf.demo.admin-password=${DEMO_ADMIN_PASSWORD:mk123}
bookleaf.demo.author-password=${DEMO_AUTHOR_PASSWORD:mk123}

bookleaf.jwt.secret=${BOOKLEAF_JWT_SECRET}
bookleaf.jwt.expiration-ms=86400000

# Local AI using Ollama
bookleaf.ai.model=${BOOKLEAF_AI_MODEL:llama3.2}
bookleaf.ai.enabled=${BOOKLEAF_AI_ENABLED:true}
